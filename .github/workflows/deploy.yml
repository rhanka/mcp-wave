name: deploy

# Build the production image, push it to public GHCR (ghcr.io/rhanka/mcp-wave),
# and roll it out on OVHcloud Managed Kubernetes Service, pinned by digest.
# This is the only supported deploy path (no manual rollouts).
#
# Platform decision 2026-07-17: tenant images live on public GHCR, pulled
# without imagePullSecrets. Secrets required (repo settings):
#   KUBE_CONFIG - base64 kubeconfig of the namespace-scoped OVH ci-deployer
#                 account (needs get/patch on deployment/mcp-wave).
# GHCR push uses the built-in GITHUB_TOKEN (packages: write), no extra secret.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "data/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/ovh/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/rhanka/mcp-wave
  NAMESPACE: mcp-wave
  PUBLIC_HOST: mcp-wave.sent-tech.ca
  OVH_INGRESS_IP: 51.79.100.177

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        run: |
          TAG="${GITHUB_SHA::7}"
          docker build -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"
          DIGEST="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{.Manifest.Digest}}')"
          case "${DIGEST}" in
            sha256:*) ;;
            *) echo "could not resolve pushed digest for ${IMAGE}:${TAG}" >&2; exit 1 ;;
          esac
          echo "Pushed ${IMAGE}:${TAG} = ${IMAGE}@${DIGEST}"
          echo "DIGEST=${DIGEST}" >> "${GITHUB_ENV}"

      - uses: azure/setup-kubectl@v4

      - name: Configure OVH Kubernetes access
        run: |
          umask 077
          mkdir -p "${HOME}/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > "${HOME}/.kube/config"

      - name: Roll out (pinned by digest)
        run: |
          kubectl -n "${NAMESPACE}" set image deployment/mcp-wave "mcp-wave=${IMAGE}@${DIGEST}"
          kubectl -n "${NAMESPACE}" rollout status deployment/mcp-wave --timeout=180s

      - name: Verify that the public hostname serves OVH
        run: |
          serial_for() {
            echo | openssl s_client -connect "${1}:443" -servername "${PUBLIC_HOST}" 2>/dev/null \
              | openssl x509 -noout -serial
          }
          normal_serial="$(serial_for "${PUBLIC_HOST}")"
          ovh_serial="$(serial_for "${OVH_INGRESS_IP}")"
          test -n "${normal_serial}"
          test "${normal_serial}" = "${ovh_serial}" || {
            echo "${PUBLIC_HOST} is not served by the OVH ingress certificate" >&2
            exit 1
          }
