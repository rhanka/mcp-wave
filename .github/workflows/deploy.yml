name: deploy

# Build the production image, push it to the existing Scaleway Container
# Registry, and roll it out on OVHcloud Managed Kubernetes Service. The only
# GitHub migration is the content of KUBE_CONFIG: replace it with the supplied
# base64-encoded OVH kubeconfig for the namespace-scoped ci-deployer account.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "data/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/ovh/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: rg.fr-par.scw.cloud/mcp-wave/mcp-wave
  GHCR_IMAGE: ghcr.io/rhanka/mcp-wave
  NAMESPACE: mcp-wave
  PUBLIC_HOST: mcp-wave.sent-tech.ca
  OVH_INGRESS_IP: 51.79.100.177

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Scaleway Container Registry
        run: |
          echo "${{ secrets.SCW_REGISTRY_PASSWORD }}" \
            | docker login rg.fr-par.scw.cloud -u "${{ secrets.SCW_REGISTRY_USER }}" --password-stdin

      - name: Build and push image
        run: |
          TAG="${GITHUB_SHA::7}"
          docker build -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"
          echo "TAG=${TAG}" >> "${GITHUB_ENV}"

      - name: Mirror image to GHCR (best-effort)
        continue-on-error: true
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx imagetools create --tag "${GHCR_IMAGE}:${TAG}" "${IMAGE}:${TAG}"
          docker buildx imagetools create --tag "${GHCR_IMAGE}:latest" "${IMAGE}:${TAG}"

      - uses: azure/setup-kubectl@v4

      - name: Configure OVH Kubernetes access
        run: |
          umask 077
          mkdir -p "${HOME}/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > "${HOME}/.kube/config"

      - name: Roll out
        run: |
          kubectl -n "${NAMESPACE}" set image deployment/mcp-wave "mcp-wave=${IMAGE}:${TAG}"
          kubectl -n "${NAMESPACE}" rollout status deployment/mcp-wave --timeout=180s

      - name: Verify that the public hostname serves OVH
        run: |
          serial_for() {
            echo | openssl s_client -connect "${1}:443" -servername "${PUBLIC_HOST}" 2>/dev/null \
              | openssl x509 -noout -serial
          }
          normal_serial="$(serial_for "${PUBLIC_HOST}")"
          ovh_serial="$(serial_for "${OVH_INGRESS_IP}")"
          test -n "${normal_serial}"
          test "${normal_serial}" = "${ovh_serial}" || {
            echo "${PUBLIC_HOST} is not served by the OVH ingress certificate" >&2
            exit 1
          }
