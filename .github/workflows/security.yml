name: security

# Dependency vulnerability gate (.security/audit-gate.mjs, same contract as
# sentropic): fails on any HIGH/CRITICAL advisory not explicitly allowlisted
# with an unexpired review_due. The runtime tree (--omit=dev) is also gated in
# the Dockerfile; this workflow covers the full tree (build/test tooling) and
# re-runs weekly so newly published advisories surface without a code change.
on:
  pull_request: {}
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Runtime dependency tree (shipped in the image)
        run: node .security/audit-gate.mjs --omit=dev

      - name: Full dependency tree (build and test tooling)
        run: node .security/audit-gate.mjs
