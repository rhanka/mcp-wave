# Wave GraphQL schema introspection.
# Requires WAVE_API_TOKEN in env (loaded from .env via `npm run codegen:introspect`).
# Output: data/wave-schema.graphql (committed; consumed by codegen.yml).
schema:
  - https://gql.waveapps.com/graphql/public:
      headers:
        Authorization: "Bearer ${WAVE_API_TOKEN}"
generates:
  data/wave-schema.graphql:
    plugins:
      - schema-ast
