apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-wave
  annotations:
    # cert-manager provisions the TLS secret via the shared ClusterIssuer
    # (DNS-01 Cloudflare on sent-tech.ca). Matches the sentropic tenant.
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - mcp-wave.sent-tech.ca
      secretName: mcp-wave-tls
  rules:
    - host: mcp-wave.sent-tech.ca
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mcp-wave
                port:
                  name: http
