apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-wave
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - mcp-wave.example.invalid
      secretName: mcp-wave-tls
  rules:
    - host: mcp-wave.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mcp-wave
                port:
                  name: http
