query ListInvoices(
  $businessId: ID!
  $page: Int = 1
  $pageSize: Int = 50
  $status: InvoiceStatus
  $customerId: ID
  $currency: CurrencyCode
  $invoiceDateStart: Date
  $invoiceDateEnd: Date
) {
  business(id: $businessId) {
    invoices(
      page: $page
      pageSize: $pageSize
      status: $status
      customerId: $customerId
      currency: $currency
      invoiceDateStart: $invoiceDateStart
      invoiceDateEnd: $invoiceDateEnd
    ) {
      pageInfo {
        currentPage
        totalPages
        totalCount
      }
      edges {
        node {
          id
          invoiceNumber
          status
          invoiceDate
          dueDate
          customer {
            id
            name
          }
          currency {
            code
          }
          total {
            value
          }
          amountDue {
            value
          }
        }
      }
    }
  }
}

query GetInvoice($businessId: ID!, $invoiceId: ID!) {
  business(id: $businessId) {
    invoice(id: $invoiceId) {
      id
      invoiceNumber
      status
      invoiceDate
      dueDate
      memo
      customer {
        id
        name
        email
      }
      currency {
        code
      }
      items {
        product {
          id
          name
        }
        description
        quantity
        unitPrice
        taxes {
          salesTax {
            id
            name
            rate
          }
          amount {
            value
          }
        }
        subtotal {
          value
        }
        total {
          value
        }
      }
      subtotal {
        value
      }
      taxTotal {
        value
      }
      total {
        value
      }
      amountDue {
        value
      }
      amountPaid {
        value
      }
      payments {
        id
        amount
        paymentDate
        paymentMethod
        memo
        accountingTransactionId
        transactionId
        state
        readonlyUrl
        createdAt
        modifiedAt
        account {
          id
          name
        }
      }
      pdfUrl
    }
  }
}

query GetInvoicePayment($businessId: ID!, $invoicePaymentId: ID!) {
  business(id: $businessId) {
    invoicePayment(id: $invoicePaymentId) {
      id
      amount
      paymentDate
      paymentMethod
      memo
      exchangeRate
      accountingTransactionId
      transactionId
      state
      readonlyUrl
      createdAt
      modifiedAt
      accountNumberLast3
      account {
        id
        name
      }
      customer {
        id
        name
        email
      }
      businessCurrency {
        code
      }
      invoiceCurrency {
        code
      }
      paymentCurrency {
        code
      }
      invoice {
        id
        invoiceNumber
      }
    }
  }
}

mutation InvoiceCreate($input: InvoiceCreateInput!) {
  invoiceCreate(input: $input) {
    didSucceed
    inputErrors {
      code
      message
      path
    }
    invoice {
      id
      invoiceNumber
      status
      pdfUrl
      total {
        value
      }
      subtotal {
        value
      }
      taxTotal {
        value
      }
    }
  }
}

mutation InvoicePatch($input: InvoicePatchInput!) {
