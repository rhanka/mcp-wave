query ListBusinesses($pageSize: Int = 20, $page: Int = 1) {
  businesses(pageSize: $pageSize, page: $page) {
    pageInfo {
      currentPage
      totalPages
      totalCount
    }
    edges {
      node {
        id
        name
        currency {
          code
        }
        timezone
      }
    }
  }
}

query GetBusinessAccountingSettings($businessId: ID!) {
  business(id: $businessId) {
    id
    isClassicAccounting
  }
}
